[package]
name = "rtop"
description = "An htop-inspired system monitor built on ntui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/rtop"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
libc = "0.2.189"
ntui = "0.2"
procfs = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "1.1.4"
