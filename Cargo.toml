[package]
name = "proctop"
description = "An htop-inspired Linux system monitor that reads /proc directly, built on ntui"
version = "0.2.0"
edition = "2024"
# let-chains in `ui::state` and `filter` are stable from here.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/proctop"
readme = "README.md"
keywords = ["monitor", "htop", "tui", "procfs", "system"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
libc = "0.2.189"
ntui = "0.3"
procfs = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
toml = "1.1.4"

[dev-dependencies]
libc = "0.2.189"
