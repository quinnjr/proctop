[package]
name = "rtop"
description = "An htop-inspired system monitor built on ntui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quinnjr/rtop"

[dependencies]
ntui = "0.2"
procfs = "0.18"
tokio = { version = "1", features = ["rt", "macros", "time"] }
